<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>录制回放</title>
<style>
:root { --bg: #101014; --panel: #18181e; --line: #2a2a33; --fg: #e6e6ea; --dim: #8a8a96; --acc: #3fa9f5; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; }
#app { display: grid; height: 100vh; grid-template-columns: 260px 1fr 340px; grid-template-rows: auto 1fr auto; }
header { grid-column: 1 / 4; display: flex; gap: 14px; align-items: baseline; padding: 6px 12px; border-bottom: 1px solid var(--line); background: var(--panel); white-space: nowrap; overflow: hidden; }
header #title { font-weight: 600; }
header #meta, header #loadinfo { color: var(--dim); overflow: hidden; text-overflow: ellipsis; }
header #top-room { margin-left: auto; color: #ffd38a; }
aside { background: var(--panel); overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
#left { border-right: 1px solid var(--line); }
#right { border-left: 1px solid var(--line); overflow-y: auto; }
#mini { width: 100%; height: 190px; display: block; border-bottom: 1px solid var(--line); }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; background: none; border: 0; color: var(--dim); padding: 6px; cursor: pointer; font: inherit; }
.tabs button.on { color: var(--fg); box-shadow: inset 0 -2px var(--acc); }
.list { overflow-y: auto; flex: 1; min-height: 0; }
.lvh { padding: 6px 8px 3px; font-weight: 600; color: #ffd38a; border-top: 1px solid var(--line); cursor: pointer; position: sticky; top: 0; background: var(--panel); }
.rv, .evr { padding: 2px 8px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rv:hover, .evr:hover, .er:hover { background: #23232b; }
.rv.cur { background: #2b3550; }
.rv i, .evr i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.rv .rt { float: right; color: var(--dim); font-size: 11px; }
.dmg { color: #ff6b6b; font-weight: 600; }
.dim { color: var(--dim); }
main { position: relative; min-width: 0; min-height: 0; }
#room { width: 100%; height: 100%; display: block; cursor: crosshair; }
#tip { position: absolute; pointer-events: none; background: rgba(10,10,14,0.92); border: 1px solid #444; padding: 4px 6px; border-radius: 4px; white-space: pre; font-size: 12px; z-index: 5; }
#loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); font-size: 15px; white-space: pre-wrap; padding: 20px; }
footer { grid-column: 1 / 4; border-top: 1px solid var(--line); background: var(--panel); padding: 6px 12px 8px; }
.ctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
.ctl button { background: #26262f; color: var(--fg); border: 1px solid #383843; border-radius: 4px; padding: 3px 9px; cursor: pointer; font: inherit; min-width: 34px; }
.ctl button:hover { background: #30303b; }
#playbtn { min-width: 46px; font-weight: 700; }
.ctl select, .ctl input[type=number] { background: #26262f; color: var(--fg); border: 1px solid #383843; border-radius: 4px; padding: 2px 4px; font: inherit; }
.ctl input[type=number] { width: 90px; }
.ctl label { color: var(--dim); user-select: none; }
.ctl .fr { font-variant-numeric: tabular-nums; }
.ctl .fr b { color: var(--fg); }
.help { margin-left: auto; color: var(--dim); font-size: 11px; }
#tl { width: 100%; height: 56px; display: block; cursor: pointer; border-radius: 3px; }
#tl2 { width: 100%; height: 26px; display: block; cursor: pointer; margin-top: 4px; border-radius: 3px; }
section { padding: 8px 10px; border-bottom: 1px solid var(--line); }
section h3 { margin: 0 0 5px; font-size: 12px; color: var(--dim); font-weight: 600; letter-spacing: .02em; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; font-size: 12px; }
.kv span { color: var(--dim); }
.kv b { font-weight: 500; font-variant-numeric: tabular-nums; word-break: break-all; }
#stats { display: grid; grid-template-columns: repeat(4, auto 1fr); gap: 1px 6px; font-size: 12px; }
#stats span { color: var(--dim); }
#stats b { font-weight: 500; }
.h { display: inline-block; width: 13px; height: 12px; margin: 0 1px 2px 0; border-radius: 6px 6px 2px 2px; background: #333; border: 1px solid #555; }
.h.full { background: #e53935; border-color: #e53935; }
.h.half { background: linear-gradient(90deg, #e53935 50%, #333 50%); border-color: #e53935; }
.h.soul { background: #6b8fd6; border-color: #6b8fd6; }
.h.soul.half { background: linear-gradient(90deg, #6b8fd6 50%, #333 50%); }
.h.bone { background: #ddd; border-color: #ddd; }
.h.broken { background: #222; border-color: #777; }
.sub { color: var(--dim); font-size: 11px; }
#res { font-size: 14px; margin: 3px 0; font-variant-numeric: tabular-nums; }
.slot { display: flex; align-items: center; gap: 6px; font-size: 12px; min-height: 22px; }
.ic { width: 26px; height: 26px; image-rendering: pixelated; }
#pmisc { font-size: 11px; color: var(--dim); margin-top: 4px; }
#inputs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; }
.key { text-align: center; padding: 3px 0; border: 1px solid #3a3a45; border-radius: 4px; color: var(--dim); font-size: 12px; position: relative; }
.key.on { background: var(--acc); color: #fff; border-color: var(--acc); }
.key.tick { border-color: var(--acc); color: var(--fg); }
.key.trig::after { content: ''; position: absolute; right: 2px; top: 2px; width: 5px; height: 5px; border-radius: 3px; background: #ffd54f; }
#tkinfo { font-size: 11px; color: var(--dim); margin-top: 3px; font-family: monospace; }
#items { display: flex; flex-wrap: wrap; gap: 3px; }
.it { position: relative; display: flex; align-items: center; gap: 4px; background: #202027; border-radius: 3px; padding: 1px 4px 1px 1px; font-size: 11px; }
.it .ic { width: 22px; height: 22px; }
.it i { font-style: normal; color: #ffd54f; }
.noicon { display: inline-block; min-width: 22px; text-align: center; background: #333; border-radius: 3px; color: var(--dim); }
.er { font-size: 12px; padding: 1px 2px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.er.sel { background: #2b3550; }
.er code, .selname code { color: #9ad; font-size: 11px; }
#ents { max-height: 220px; overflow-y: auto; }
.selname { margin-bottom: 4px; }
#fev div { color: #ffd38a; }
/* 实录画面层与并排 */
#vidwrap { position: absolute; inset: 0; background: #000; display: grid; place-items: center; }
#vidwrap video { max-width: 100%; max-height: 100%; image-rendering: pixelated; }
#vidmsg { position: absolute; top: 40%; color: #ffd38a; background: rgba(0,0,0,.7); padding: 6px 10px; border-radius: 4px; }
#vidinfo { position: absolute; left: 6px; bottom: 4px; color: #aaa; font-size: 11px; }
main[data-mode="split"] #room { width: 50%; float: left; }
main[data-mode="split"] #vidwrap { left: 50%; }
main[data-mode="art"] #room, main[data-mode="split"] #room { cursor: grab; image-rendering: pixelated; }
/* 美术模式的游戏风格（纸张 / 木纹） */
body.artui footer { background: linear-gradient(#cdb48a, #b89a6c); border-top: 3px solid #5a3d22; color: #2b1d10; }
body.artui footer .ctl button { background: linear-gradient(#8a5a33, #5e3a1e); color: #f6e7c8; border: 2px solid #3a2412; border-radius: 3px; box-shadow: inset 0 1px #b07a48; font-weight: 700; }
body.artui footer .ctl button:hover { background: linear-gradient(#9c6a3f, #6c4425); }
body.artui footer .ctl select, body.artui footer .ctl input[type=number] { background: #efe0bd; color: #2b1d10; border: 2px solid #6b4a2a; }
body.artui footer .ctl label, body.artui .help { color: #4a3420; }
body.artui footer .ctl .fr b { color: #2b1d10; }
body.artui #tl, body.artui #tl2 { border: 2px solid #5a3d22; }
body.artui header { background: #2b1d10; color: #f0dfbd; }
@media (max-width: 900px) {
  #app { grid-template-columns: 1fr; grid-template-rows: auto 55vh auto auto auto; height: auto; }
  header, footer { grid-column: 1; }
  #left, #right { max-height: 50vh; }
}
</style>
</head>
<body>
<div id="app">
  <header><span id="title">录制回放</span><span id="meta"></span><span id="loadinfo"></span><span id="top-room"></span></header>
  <aside id="left">
    <canvas id="mini" title="本层地图：白 = 当前房间，亮 = 到当前帧为止进过，暗 = 未进；彩色框 = 特殊房间"></canvas>
    <div class="tabs"><button class="on" data-tab="rooms">房间</button><button data-tab="events">事件</button></div>
    <div id="rooms" class="list"></div>
    <div id="events" class="list" hidden></div>
  </aside>
  <main data-mode="geo"><canvas id="room"></canvas><div id="vidwrap" hidden><video id="vid" muted playsinline preload="auto"></video><div id="vidmsg" hidden>本帧不在实录范围内</div><div id="vidinfo"></div></div><div id="tip" hidden></div><div id="loading">加载中…</div></main>
  <aside id="right">
    <section><h3>帧</h3><div class="kv">
      <span>帧 n</span><b id="fnum"></b><span>游戏时间</span><b id="ftime"></b><span>墙钟（含暂停）</span><b id="fwall"></b>
      <span>gf</span><b id="fgf"></b><span>关键帧</span><b id="fkf"></b><span>MT [cursor, hash]</span><b id="fmt"></b><span>digest</span><b id="fdg"></b>
    </div></section>
    <section><h3>楼层 / 房间</h3><div id="lvl"></div><div id="rinfo" class="sub"></div><div id="rstate" class="sub"></div></section>
    <section><h3>玩家</h3><div id="hearts"></div><div id="res"></div><div id="stats"></div><div id="actives"></div><div id="pmisc"></div></section>
    <section><h3>输入（实心 = 逻辑 tick 按下；描边 = 本帧中间 tick 按下；黄点 = triggered）</h3>
      <div id="inputs"></div><div id="tkinfo"></div></section>
    <section><h3>本帧事件</h3><div id="fev"></div></section>
    <section><h3 id="items-h">道具</h3><div id="items"></div></section>
    <section><h3 id="ents-h">实体</h3><div id="ents"></div></section>
    <section><h3>选中对象</h3><div id="selent"></div></section>
  </aside>
  <footer>
    <div class="ctl">
      <button id="prevr" title="上一个房间（↑）">⏮</button><button id="preve" title="上一个事件（[）">◆←</button>
      <button id="prevf" title="上一帧（←，Shift = 30 帧）">◀</button><button id="playbtn" title="播放/暂停（空格）">▶</button>
      <button id="nextf" title="下一帧（→，Shift = 30 帧）">▶|</button><button id="nexte" title="下一个事件（]）">→◆</button><button id="nextr" title="下一个房间（↓）">⏭</button>
      <select id="speed" title="倍速（+/-）"></select>
      <select id="mode" title="视图（M 切换）：几何 / 真实美术 / 实录画面 / 美术+实录并排"><option value="geo">几何</option><option value="art">美术</option><option value="video">实录</option><option value="split">美术+实录</option></select>
      <label title="跟随玩家（F）"><input type="checkbox" id="o-follow">跟随(F)</label>
      <label title="HUD 与小地图（H，美术模式）"><input type="checkbox" id="o-hud" checked>HUD(H)</label>
      <button id="camreset" title="复位整房视角（R）">⌂</button>
      <span class="fr">帧 <b id="fnum2"></b></span>
      <input id="goto" type="number" min="1" placeholder="跳到帧…">
      <label><input type="checkbox" id="o-fx">特效(E)</label>
      <label><input type="checkbox" id="o-lb">标签(L)</label>
      <label><input type="checkbox" id="o-vel">速度(V)</label>
      <label><input type="checkbox" id="o-gi">格号(G)</label>
      <label><input type="checkbox" id="o-inv">不可见实体</label>
      <span class="help">拖动进度条 · 进度条上滚轮逐帧 · 画面：滚轮缩放、拖拽平移、Alt+滚轮逐帧、F 跟随、C 游戏镜头、R 复位、M 视图、H HUD · 点实体看字段 · 上条 = 整局（层/房间/受伤·道具·卡药），下条 = 当前房间</span>
    </div>
    <canvas id="tl"></canvas>
    <canvas id="tl2"></canvas>
  </footer>
</div>
<script id="rv-data" type="application/octet-stream">/*__DATA__*/</script>
<script>/*__CORE__*/</script>
<script>/*__ART__*/</script>
<script>/*__APP__*/</script>
<script>
(function () {
  // 输入按键格、标签页
  const ACT = ['←', '→', '↑', '↓', '射←', '射→', '射↑', '射↓', '炸弹', '主动', '卡/药', '丢弃'];
  const NM = ['LEFT', 'RIGHT', 'UP', 'DOWN', 'SHOOTLEFT', 'SHOOTRIGHT', 'SHOOTUP', 'SHOOTDOWN', 'BOMB', 'ITEM', 'PILLCARD', 'DROP'];
  document.getElementById('inputs').innerHTML = ACT.map((a, j) => '<div class="key" title="' + NM[j] + '">' + a + '</div>').join('');
  document.querySelectorAll('.tabs button').forEach(function (b) {
    b.onclick = function () {
      document.querySelectorAll('.tabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
      document.getElementById('rooms').hidden = b.dataset.tab !== 'rooms';
      document.getElementById('events').hidden = b.dataset.tab !== 'events';
    };
  });
  // 底栏帧号跟随
  setInterval(function () { const r = window.__rv; if (r && r.run) document.getElementById('fnum2').textContent = (r.cur + 1) + ' / ' + r.run.N; }, 100);
})();
</script>
</body>
</html>
