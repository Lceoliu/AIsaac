<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>真人录制 · 状态回放</title>
<style>body{font:16px "Microsoft YaHei",sans-serif;background:#e8edf0;color:#263544;max-width:960px;margin:24px auto}canvas{width:100%;background:#423c38}button,input{margin:12px 8px 0 0}input{width:65%}pre{white-space:pre-wrap}</style>
<h1>真人录制 · 状态回放</h1><canvas id="view" width="960" height="720"></canvas><button id="play">播放 / 暂停</button><input id="seek" type="range" min="0" value="0"><pre id="info"></pre>
<p>原引擎记录的几何状态，不重新运行模拟器。实心圆按高度偏移，空心圆为地面投影；文字标注 Boss 动画与帧号。</p>
<script>
const rows=/*DATA*/,frames=rows.filter(r=>r.obs),c=document.getElementById('view'),ctx=c.getContext('2d'),seek=document.getElementById('seek');let i=0,playing=false,last=0;seek.max=frames.length-1;
function circle(p,r,color,filled=true){ctx.beginPath();ctx.arc(p[0],p[1],Math.max(2,r),0,Math.PI*2);ctx.fillStyle=ctx.strokeStyle=color;filled?ctx.fill():ctx.stroke()}
function draw(){const row=frames[i],s=row.obs;ctx.clearRect(0,0,960,720);ctx.save();ctx.scale(1.5,1.5);for(const t of s.terrain.cells){ctx.fillStyle=t[6]?'#161b20':t[8]?'#77736b':'#48423b';ctx.fillRect(t[1]-20,t[2]-20,39,39)}for(const e of s.entities){const color=e.boss?'#c1a3aa':e.projectile?'#df7f76':e.bomb?'#acadb2':'#96c7dc';circle(e.pos,e.size,color,false);circle([e.pos[0],e.pos[1]+(e.height??e.position_offset?.[1]??0)+(e.sprite_offset?.[1]||0)],e.size*.6,color);if(e.boss){ctx.fillStyle='#fff';ctx.fillText(e.anim+' '+e.aframe,e.pos[0]-35,e.pos[1]-35)}}for(const p of s.players)circle(p.pos,p.size,'#ecd6b1');ctx.restore();seek.value=i;document.getElementById('info').textContent=JSON.stringify({frame:i,total:frames.length-1,seconds:(i/30).toFixed(2),hearts:s.players[0].hearts,events:s.combat,input_queries:row.queries?.length||0,movement:row.movement,shooting:row.shooting},null,2)}
seek.oninput=()=>{i=+seek.value;draw()};document.getElementById('play').onclick=()=>{playing=!playing;last=performance.now()};function tick(t){if(playing&&t-last>=1000/30){i=Math.min(frames.length-1,i+Math.floor((t-last)/(1000/30)));last=t;draw();if(i===frames.length-1)playing=false}requestAnimationFrame(tick)}draw();requestAnimationFrame(tick);
</script></html>
