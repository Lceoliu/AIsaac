<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Isaac 真人录制</title>
<style>:root{--bg:#e8edf0;--ink:#263544;--accent:#426c83;--line:#b8c6ce;--error:#a43e37}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px "Microsoft YaHei",sans-serif}main{max-width:540px;padding:26px;margin:auto}h1{font-size:26px;margin:0 0 22px}h2{font-size:17px;margin-top:28px}#state{font-size:22px;padding:14px 0;border-block:2px solid var(--line)}#error{color:var(--error);white-space:pre-wrap}button{font:inherit;padding:11px 13px;border:1px solid var(--line);border-radius:4px;color:var(--ink);background:#f6f8fa;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}button.primary{background:var(--accent);color:white}nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}dl{display:grid;grid-template-columns:100px 1fr;gap:9px}dd{margin:0;overflow-wrap:anywhere}small{color:#596d7b}li{margin:12px 0}a{color:#245c78}#path{font-size:12px;overflow-wrap:anywhere}kbd{font:inherit;background:#d4dfe6;padding:1px 5px}#message{min-height:24px}section{border-top:1px solid var(--line);margin-top:24px}</style>
<main><h1>Isaac 真人录制</h1><div id="state">正在连接录制服务</div><p id="error" role="alert"></p>
<dl><dt>当前回合</dt><dd id="episode">—</dd><dt>已写入</dt><dd id="frames">—</dd><dt>操作采样</dt><dd id="inputs">—</dd><dt>已验收回合</dt><dd id="count">0 / 10</dd><dt>场景</dt><dd>Isaac · 无额外道具 · Monstro · 空房</dd></dl>
<nav><button data-command="prepare">准备 / 重建场景</button><button data-command="summon">重新召唤 Monstro</button><button data-command="start" class="primary">开始录制 F6</button><button data-command="reset">保存并重置 F7</button><button data-command="stop">结束本局 F8</button><button data-command="finish_session">结束会话</button></nav><div id="message" role="status"></div>
<small>开始后倒数 3 秒，请切回游戏。胜利、死亡或 120 秒自动结束并保存；F7 不会覆盖上一局。关闭面板不等于停止录制。</small>
<section><h2>已保存的回合</h2><ul id="episodes"></ul></section><section><h2>保存位置</h2><div id="path"></div></section></main>
<script>
const labels={idle:'尚未准备',preparing:'正在准备场景',ready:'场景就绪，尚未录制',countdown:'即将开始，请切回游戏',recording:'正在录制',finished:'本局结束，检查保存结果',error:'录制故障，请勿继续',offline:'游戏未连接 / 已退出',closed:'会话已结束，数据已保留'};
let busy=false,lastEpisodes="";async function refresh(){try{const r=await fetch('/api/status'),s=await r.json();if(!r.ok)throw Error(s.error);if(!s.pending&&document.getElementById('message').textContent==='指令已发送，等待游戏确认')document.getElementById('message').textContent='指令已执行';document.getElementById('state').textContent=labels[s.mode]||s.mode;document.getElementById('error').textContent=s.error||'';document.getElementById('episode').textContent=s.episode||'—';document.getElementById('frames').textContent=`${s.frame||0} 帧 · ${((s.bytes||0)/1048576).toFixed(2)} MiB`;document.getElementById('inputs').textContent=`${s.input_queries||0} 次 · 非零 ${s.active_queries||0} 次`;document.getElementById('count').textContent=`${s.episodes.filter(e=>e.valid&&e.active_queries>0&&e.source==='human'&&['win','death','timeout'].includes(e.outcome)).length} / 10`;document.getElementById('path').textContent=s.root;const episodeSignature=JSON.stringify(s.episodes);if(episodeSignature!==lastEpisodes){lastEpisodes=episodeSignature;document.getElementById('episodes').replaceChildren(...s.episodes.map(e=>{let li=document.createElement('li');li.textContent=e.valid?`${e.file} · ${e.outcome} · ${e.seconds.toFixed(1)} 秒 · ${e.source}${e.active_queries?'':' · 未检测到操作'} `:`${e.file} · 验收失败：${e.error}`;if(e.valid){let a=document.createElement('a');a.href='/replay/'+e.file.replace('.jsonl','.html');a.target='_blank';a.textContent='回放';li.append(a)}return li}));}for(const b of document.querySelectorAll('button')){const allowed=b.dataset.command==='start'||b.dataset.command==='summon'?s.mode==='ready':b.dataset.command==='stop'?['recording','countdown'].includes(s.mode):!['offline','closed','preparing','countdown'].includes(s.mode);b.disabled=busy||s.pending||!allowed}}catch(e){document.getElementById('error').textContent='控制服务不可达：'+e.message;for(const b of document.querySelectorAll('button'))b.disabled=true}}
for(const b of document.querySelectorAll('button'))b.onclick=async()=>{busy=true;try{const r=await fetch('/api/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command:b.dataset.command})});const s=await r.json();if(!r.ok)throw Error(s.error);document.getElementById('message').textContent='指令已发送，等待游戏确认'}catch(e){document.getElementById('message').textContent=e.message}finally{busy=false;refresh()}};refresh();setInterval(refresh,1000);
</script></html>
