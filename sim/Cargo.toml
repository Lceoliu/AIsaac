[package]
name = "isaac_sim"
version = "0.1.0"
edition = "2021"
description = "Headless single-room combat kernel for The Binding of Isaac (Repentance+ J460), translated from decompiled game logic"
license = "MIT"
publish = false

[lib]
name = "isaac_sim"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
serde_json = "1"
rayon = "1.11"

[profile.release]
opt-level = 3
debug = false
